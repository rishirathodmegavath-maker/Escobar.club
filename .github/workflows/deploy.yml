name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 200.141.14.221
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/escobar-club/app
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up --build -d
            # `up -d` only recreates a container when its service definition changes, not
            # when a bind-mounted file's *content* does - so a Caddyfile-only edit is never
            # picked up without an explicit restart.
            docker compose -f docker-compose.prod.yml restart caddy
            docker image prune -f
