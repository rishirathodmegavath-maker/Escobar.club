name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 200.141.14.221
          # Dedicated non-root deploy user (docker group only, no sudo) - see /opt/escobar-club/app
          # ownership. Previously connected as root directly.
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/escobar-club/app
            git fetch origin main
            git reset --hard origin/main
            # `--force-recreate` because plain `up -d` sometimes skips recreating a container
            # even when its resolved config (image, env, or a bind-mounted file's *content*)
            # changed - bitten by this twice: once with Caddyfile-only edits, once with a
            # .env-only change not reaching a rebuilt backend. Force it every deploy instead
            # of trying to predict when compose's change-detection will or won't catch it.
            docker compose -f docker-compose.prod.yml up --build -d --force-recreate
            docker image prune -f
