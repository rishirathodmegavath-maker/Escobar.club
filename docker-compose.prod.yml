services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-escobar_club}
      MYSQL_USER: ${DB_USERNAME:-escobar}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-escobar_club}
      DB_USERNAME: ${DB_USERNAME:-escobar}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      UPLOAD_DIR: /app/uploads
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:?APIFY_API_TOKEN must be set}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-apify~instagram-scraper}
      APIFY_BASE_URL: ${APIFY_BASE_URL:-https://api.apify.com/v2}
      APIFY_TIMEOUT_MS: ${APIFY_TIMEOUT_MS:-120000}
      METRICS_SYNC_MIN_INTERVAL_MINUTES: ${METRICS_SYNC_MIN_INTERVAL_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-https://escobar.club/reset-password}
      ACCOUNT_LOCKOUT_MAX_ATTEMPTS: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_DURATION_MINUTES: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:-15}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-Escobar Club}
      TWO_FACTOR_SECRET_KEY: ${TWO_FACTOR_SECRET_KEY:?TWO_FACTOR_SECRET_KEY must be set}
      OTP_LOGIN_CODE_TTL_MINUTES: ${OTP_LOGIN_CODE_TTL_MINUTES:-10}
      OTP_LOGIN_MAX_ATTEMPTS: ${OTP_LOGIN_MAX_ATTEMPTS:-5}
      OTP_LOGIN_RESEND_INTERVAL_SECONDS: ${OTP_LOGIN_RESEND_INTERVAL_SECONDS:-60}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-logging}
      EMAIL_FROM: ${EMAIL_FROM:-Escobar Club <onboarding@resend.dev>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ZEPTOMAIL_API_KEY: ${ZEPTOMAIL_API_KEY:-}
      EMAIL_VERIFICATION_TOKEN_TTL_HOURS: ${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:-48}
      EMAIL_VERIFICATION_FRONTEND_URL: ${EMAIL_VERIFICATION_FRONTEND_URL:-https://escobar.club/verify-email}
    volumes:
      # Bind-mounted to a plain host directory (not an opaque Docker volume) so uploaded
      # media is easy to inspect/back up and to migrate to Cloudflare R2 later.
      - /opt/escobar-club/media:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    # No published host port - only reachable from other containers (Caddy reaches it
    # over the compose network). Caddy is the sole public entry point.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
