server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 210M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme here is nginx's own *incoming* connection scheme, which is always plain
        # http - Caddy (the actual public-facing TLS terminator) already set the correct
        # X-Forwarded-Proto before reaching us; pass that through instead of clobbering it,
        # or the backend's isSecure() checks (e.g. the refresh-token cookie's Secure flag)
        # silently see "http" even when the real client connection was https.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Some backend calls (e.g. Apify Instagram metrics sync, app.apify.timeout-ms) can
        # legitimately take up to ~2 minutes, and a 200MB video upload on a slow connection can
        # take even longer to stream through. Keep this comfortably above both APIFY_TIMEOUT_MS
        # and worst-case upload time so the backend's own timeout/response always wins over a
        # raw nginx 504/408.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
    }

    location ^~ /media/ {
        proxy_pass http://backend:8080/media/;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
