spring:
  application:
    name: escobar-club
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-every-environment-please-32bytes+}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    upload-dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:/media}
    max-file-size-bytes: ${UPLOAD_MAX_BYTES:20971520}
    allowed-image-types: image/png,image/jpeg,image/webp,image/gif
    allowed-video-types: video/mp4,video/quicktime,video/webm
    allowed-document-types: application/pdf
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  apify:
    base-url: ${APIFY_BASE_URL:https://api.apify.com/v2}
    actor-id: ${APIFY_ACTOR_ID:apify~instagram-scraper}
    token: ${APIFY_API_TOKEN:}
    timeout-ms: ${APIFY_TIMEOUT_MS:120000}
  metrics-sync:
    min-interval-minutes: ${METRICS_SYNC_MIN_INTERVAL_MINUTES:15}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    frontend-reset-url-base: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
  email:
    provider: ${EMAIL_PROVIDER:logging}
    from: ${EMAIL_FROM:Escobar Club <onboarding@resend.dev>}
    resend:
      api-key: ${RESEND_API_KEY:}
    zeptomail:
      api-key: ${ZEPTOMAIL_API_KEY:}
      # Zoho data centers are region-specific (api.zeptomail.com for US, .in for India, .eu
      # for Europe, etc.) - the account's own SMTP/API tab in the dashboard shows the right
      # host, it does NOT default to .com for every account.
      api-url: ${ZEPTOMAIL_API_URL:https://api.zeptomail.in}
  email-verification:
    token-ttl-hours: ${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:48}
    frontend-verify-url-base: ${EMAIL_VERIFICATION_FRONTEND_URL:http://localhost:5173/verify-email}
  account-lockout:
    max-attempts: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:5}
    duration-minutes: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:15}
  two-factor:
    issuer: ${TWO_FACTOR_ISSUER:Escobar Club}
    secret-encryption-key: ${TWO_FACTOR_SECRET_KEY:change-this-two-factor-encryption-key-in-every-environment}
  otp-login:
    code-ttl-minutes: ${OTP_LOGIN_CODE_TTL_MINUTES:10}
    max-attempts: ${OTP_LOGIN_MAX_ATTEMPTS:5}
    min-resend-interval-seconds: ${OTP_LOGIN_RESEND_INTERVAL_SECONDS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
